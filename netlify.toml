# Netlify — কোনো build লাগবে না, রিপোর রুট থেকেই সার্ভ হবে।
[build]
  command = ""
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/firebase-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
